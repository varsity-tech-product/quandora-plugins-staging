name: Validate staging plugin package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests and skills
        run: python3 scripts/check-staging-plugin.py
      - name: Validate WorkBuddy Connector candidate
        run: python3 .github/check-workbuddy-connector.py
