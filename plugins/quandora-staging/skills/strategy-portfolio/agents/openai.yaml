interface:
  display_name: "Strategy Portfolio Staging"
  short_description: "Compose and evaluate multi-strategy portfolios"
  icon_small: "./assets/strategy-portfolio.png"
  icon_large: "./assets/strategy-portfolio.png"
  brand_color: "#F28C00"
  default_prompt: "Use $strategy-portfolio to compose exact StrategyVersions, select exact completed source runs, and evaluate their normalized weighted Portfolio result after confirmation."

dependencies:
  tools:
    - type: "mcp"
      value: "quandora-staging"
      description: "Quandora Staging Strategy Portfolio connection"
      transport: "streamable_http"
      url: "https://mcp-staging.varsity.lol/quant"
      oauth_resource: "https://mcp-staging.varsity.lol/quant"
