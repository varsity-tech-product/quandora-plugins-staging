interface:
  display_name: "Strategy Building Staging"
  short_description: "Compose, optimize, and backtest cross-sectional staging strategies"
  icon_small: "./assets/strategy-building.png"
  icon_large: "./assets/strategy-building.png"
  brand_color: "#F28C00"
  default_prompt: "Use $strategy-building to choose Official, Mine, or Shared Quandora factors, create or backtest a Strategy, or rerun an explicitly selected replayable failed Strategy run."

dependencies:
  tools:
    - type: "mcp"
      value: "quandora-staging"
      description: "Quandora Staging Strategy Building connection"
      transport: "streamable_http"
      url: "https://mcp-staging.varsity.lol/quant"
      oauth_resource: "https://mcp-staging.varsity.lol/quant"
