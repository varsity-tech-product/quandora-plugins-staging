interface:
  display_name: "Paper Trading Staging"
  short_description: "Run and monitor staged strategy paper trading"
  icon_small: "./assets/paper-trading.png"
  icon_large: "./assets/paper-trading.png"
  brand_color: "#F28C00"
  default_prompt: "Use $paper-trading to start or monitor simulated execution from an existing completed StrategyRun or PortfolioRun after confirmation; use $strategy-building or $strategy-portfolio when research preparation is still needed."

dependencies:
  tools:
    - type: "mcp"
      value: "quandora-staging"
      description: "Quandora Staging Paper Trading connection"
      transport: "streamable_http"
      url: "https://mcp-staging.varsity.lol/quant"
      oauth_resource: "https://mcp-staging.varsity.lol/quant"
